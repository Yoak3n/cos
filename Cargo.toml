[package]
name = "cos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dsh-rust CLI 宿主（Rust 复刻 dsh 插件化主干，A 形态）"

[dependencies]
dsh-agent = { path = "crates/dsh-agent" }
dsh-agent-loop = { path = "crates/dsh-agent-loop" }
dsh-core = { path = "crates/dsh-core" }
dsh-invariants = { path = "crates/dsh-invariants" }
dsh-llm = { path = "crates/dsh-llm" }
dsh-llm-mock = { path = "crates/dsh-llm-mock" }
dsh-loader = { path = "crates/dsh-loader" }
dsh-session = { path = "crates/dsh-session" }
dsh-shell = { path = "crates/dsh-shell" }
dsh-system-prompt = { path = "crates/dsh-system-prompt" }
dsh-tools = { path = "crates/dsh-tools" }
plugin-bash = { path = "plugins/plugin-bash" }
plugin-demo = { path = "plugins/plugin-demo" }
plugin-todo = { path = "plugins/plugin-todo" }
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
inventory = "0.3"
