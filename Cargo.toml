[package]
name = "cos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "cos CLI 宿主（插件化主干，A 形态）"

[dependencies]
cos-agent = { path = "crates/cos-agent" }
cos-agent-loop = { path = "crates/cos-agent-loop" }
cos-core = { path = "crates/cos-core" }
cos-invariants = { path = "crates/cos-invariants" }
cos-llm = { path = "crates/cos-llm" }
cos-llm-mock = { path = "crates/cos-llm-mock" }
cos-llm-opencode = { path = "crates/cos-llm-opencode" }
cos-loader = { path = "crates/cos-loader" }
cos-memory = { path = "crates/cos-memory" }
cos-session = { path = "crates/cos-session" }
cos-shell = { path = "crates/cos-shell" }
cos-system-prompt = { path = "crates/cos-system-prompt" }
cos-tools = { path = "crates/cos-tools" }
plugin-bash = { path = "plugins/plugin-bash" }
plugin-demo = { path = "plugins/plugin-demo" }
plugin-llm = { path = "plugins/plugin-llm" }
plugin-memory = { path = "plugins/plugin-memory" }
plugin-todo = { path = "plugins/plugin-todo" }
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
inventory = "0.3"
