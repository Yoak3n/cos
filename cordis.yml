# Cordis composition for the harness: every row is one source plugin living in
# its own workspace package under packages/ (Loader resolves bare @cos/*
# names; tsx or Node type-stripping transpiles the .ts). Load order is
# expressed through each service's `static inject`, not by row order.
- id: llm
  name: '@cos/llm'
- id: credentials
  name: '@cos/credentials'
  config:
    # Secrets file backing file-sourced credentials (e.g. deepseek.apiKey).
    # gitignored; see secrets.example.yml for the shape.
    file: ./secrets.yml
- id: session
  name: '@cos/session'
- id: persistence
  name: '@cos/persistence'
  config:
    # Storage under COS_HOME (or cwd): `root: sessions` → `$COS_HOME/sessions`.
    # format: standard (generic agent event stream) | internal (raw SessionEvent)
    # segmentBytes / maxSegments bound long-lived session growth.
    root: sessions
- id: system-prompt
  name: '@cos/system-prompt'
- id: persona
  name: '@cos/persona'
- id: tools
  name: '@cos/tools'
- id: skills
  name: '@cos/skills'
- id: llm-deepseek
  name: '@cos/llm-deepseek'
  config:
    baseUrl: https://api.deepseek.com
    defaultModel: deepseek-flash
# Mock adapter — optional test provider for offline / no-key runs. The registry
# holds both providers and the agent's route selects which serves; the real
# DeepSeek row above is the default. To use the mock, disable this DeepSeek row
# and mount the mock, or apply overlays/mock.yml:
# - id: mock-llm
#   name: '@cos/mock-llm'
- id: agents
  name: '@cos/agents'
- id: agent-loop
  name: '@cos/agent-loop'
  config:
    debugSystemPrompt: false
- id: subagents
  name: '@cos/subagents'
  config:
    # worker 单次运行的默认墙上时钟上限（超时则 cancel 该 worker agent）
    defaultTimeoutMs: 120000
