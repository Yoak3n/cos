# Overlay layer demo: run the real DeepSeek provider instead of the mock.
# Apply with:  pnpm dev   (after setting COS_OVERLAYS=overlays/real.yml)
# Patch semantics match dsh: patch rows by id (replace fields), insert new rows.
- id: mock-llm
  disabled: true
- insert:
    - id: llm-deepseek
      name: '@cos/llm-deepseek'
      config:
        baseUrl: https://api.deepseek.com
        defaultModel: deepseek-v4-flash